name: sw probe v4.2 (Split decision branch, WouldFit, IsAnFollow chain)

on:
  push:
    branches:
      - instr-probe
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get build-dep -y libreoffice
          sudo apt-get install -y ccache gperf flex bison pkg-config libxml2-utils

      - name: Prepare ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sw-wouldfit-${{ runner.os }}
          max-size: 4G

      - name: Configure
        run: |
          export CC="ccache gcc"
          export CXX="ccache g++"
          ./autogen.sh --disable-gui --without-java --disable-python --disable-odk \
            --without-doxygen --disable-report-builder \
            --disable-gstreamer-1-0 --without-myspell-dicts --disable-lotuswordpro \
            --disable-firebird-sdbc --disable-extensions --disable-opencl \
            --disable-scripting --with-parallelism=$(nproc)

      - name: Full build (upstream + v4.2 probe, no fix)
        run: make -j$(nproc)

      - name: Run conversion with v4.2 decision counters
        run: |
          mkdir -p out
          set +e
          LOFIX_TRACE_SPLIT=1 timeout -k 15 180 instdir/program/soffice --headless --convert-to pdf --outdir out sw/qa/core/layout/data/oversized-as-char-fly-grid.docx 2> trace.txt
          rc=$?
          set -e
          echo "conversion rc=$rc (124=timeout)"
          wc -l trace.txt
          echo "=== counts"
          for pat in "LOFIX MakeAll Enter" "LOFIX MakeAll Exit" "LOFIX Split Enter" "LOFIX Split Exit" "LOFIX Split Space" "LOFIX Split Decision" "LOFIX Split Branch" "LOFIX Split EarlyExit" "LOFIX WouldFit" "LOFIX FollowFlowLine" "LOFIX Tab Created" "LOFIX Tab Destroyed" "LOFIX Row Created" "LOFIX Row Destroyed"; do
            echo "$pat: $(grep -c "$pat" trace.txt || true)"
          done
          echo "=== Split decision: final distribution"
          grep 'LOFIX Split Decision' trace.txt | grep -oE 'final=[0-9]+' | sort | uniq -c || true
          echo "=== Split decision funnel (count of value 1)"
          for k in after_init after_attr after_sections after_fly final; do
            echo "$k=1: $(grep 'LOFIX Split Decision' trace.txt | grep -cE "$k=1( |$)" || true)"
          done
          echo "=== Split branch paths"
          grep 'LOFIX Split Branch' trace.txt | grep -oE 'path=[a-z_]+' | sort | uniq -c || true
          echo "=== Split branch: row_span flag of created follow flow lines"
          grep 'LOFIX FollowFlowLine' trace.txt | grep -oE 'row_span=[0-9]+' | sort | uniq -c || true
          echo "=== Split early exit reasons"
          grep 'LOFIX Split EarlyExit' trace.txt | grep -oE 'reason=[a-z_]+' | sort | uniq -c || true
          echo "=== first 12 Split Decision lines"
          grep 'LOFIX Split Decision' trace.txt | head -12 || true
          echo "=== last 5 Split Decision lines"
          grep 'LOFIX Split Decision' trace.txt | tail -5 || true
          echo "=== first 8 Split Branch lines"
          grep 'LOFIX Split Branch' trace.txt | head -8 || true
          echo "=== last 5 Split Branch lines"
          grep 'LOFIX Split Branch' trace.txt | tail -5 || true
          echo "=== first 10 FollowFlowLine lines"
          grep 'LOFIX FollowFlowLine' trace.txt | head -10 || true
          echo "=== WouldFit events by entry/exit"
          grep 'LOFIX WouldFit' trace.txt | grep -oE 'LOFIX WouldFit [A-Za-z]+' | sort | uniq -c || true
          echo "=== WouldFit Exit results"
          grep 'LOFIX WouldFit Exit' trace.txt | grep -oE 'ret=[0-9]+' | sort | uniq -c || true
          echo "=== WouldFit Exit inside/keep"
          grep 'LOFIX WouldFit Exit' trace.txt | grep -oE 'inside=[0-9]+' | sort | uniq -c || true
          grep 'LOFIX WouldFit Exit' trace.txt | grep -oE 'keep=[0-9]+' | sort | uniq -c || true
          echo "=== first 10 WouldFit Exit lines"
          grep 'LOFIX WouldFit Exit' trace.txt | head -10 || true
          echo "=== last 10 WouldFit Exit lines"
          grep 'LOFIX WouldFit Exit' trace.txt | tail -10 || true
          echo "=== IsAnFollow: totals over Split exits"
          awk '/LOFIX Split Exit/ { for (i=1;i<=NF;i++) {
                   if ($i ~ /^isanfollow=/) { split($i,a,"="); calls+=a[2] }
                   if ($i ~ /^isanfollow_steps=/) { split($i,a,"="); steps+=a[2] }
                   if ($i ~ /^isanfollow_true=/) { split($i,a,"="); tru+=a[2] }
                   if ($i ~ /^max_isanfollow_steps=/) { split($i,a,"="); if (a[2]+0>mx) mx=a[2]+0 }
                 } }
               END { print "calls=" calls " steps=" steps " true=" tru " max_steps=" mx }' trace.txt
          echo "=== IsAnFollow: top max_isanfollow_steps per Split / MakeAll"
          grep 'LOFIX Split Exit' trace.txt | grep -oE 'max_isanfollow_steps=[0-9]+' | cut -d= -f2 | sort -n | tail -3 || true
          grep 'LOFIX MakeAll Exit' trace.txt | grep -oE 'max_isanfollow_steps=[0-9]+' | cut -d= -f2 | sort -n | tail -3 || true
          echo "=== MakeAll: split_calls distribution (value:count)"
          grep 'LOFIX MakeAll Exit' trace.txt | grep -oE 'split_calls=[0-9]+' | cut -d= -f2 | sort -n | uniq -c | sort -rn | head -8 || true
          echo "=== iterator: max/sum per Split"
          grep 'LOFIX Split Exit' trace.txt | grep -oE 'iter=[0-9]+' | cut -d= -f2 | sort -n | tail -3 || true
          awk '/LOFIX Split Exit/ { for (i=1;i<=NF;i++) if ($i ~ /^iter=/) { split($i,a,"="); s+=a[2] } }
               END { print "split_iter_sum=" s }' trace.txt
          echo "=== life cycle at kill time"
          awk '/LOFIX Row Created/ { for (i=1;i<=NF;i++) if ($i ~ /^id=/) { split($i,a,"="); c[a[2]]=1 } }
               /LOFIX Row Destroyed/ { for (i=1;i<=NF;i++) if ($i ~ /^id=/) { split($i,a,"="); delete c[a[2]] } }
               END { n=0; for (k in c) n++; print "rows_alive=" n }' trace.txt
          awk '/LOFIX Tab Created/ { for (i=1;i<=NF;i++) if ($i ~ /^id=/) { split($i,a,"="); c[a[2]]=1 } }
               /LOFIX Tab Destroyed/ { for (i=1;i<=NF;i++) if ($i ~ /^id=/) { split($i,a,"="); delete c[a[2]] } }
               END { n=0; for (k in c) n++; print "tabs_alive=" n }' trace.txt
          echo "=== peak row_live / row_peak / tab_live / tab_peak"
          grep -oE 'row_live=[0-9]+' trace.txt | cut -d= -f2 | sort -n | tail -1 || true
          grep -oE 'row_peak=[0-9]+' trace.txt | cut -d= -f2 | sort -n | tail -1 || true
          grep -oE 'tab_live=[0-9]+' trace.txt | cut -d= -f2 | sort -n | tail -1 || true
          grep -oE 'tab_peak=[0-9]+' trace.txt | cut -d= -f2 | sort -n | tail -1 || true
          echo "=== tail"
          tail -20 trace.txt || true
          if ! grep -q 'LOFIX Split Decision' trace.txt; then
            echo "::error::probe never reached the Split decision - do not read this as evidence"
            exit 1
          fi
          if ! grep -q 'LOFIX WouldFit' trace.txt; then
            echo "::error::probe never entered WouldFit on the target frame"
            exit 1
          fi

      - name: Upload probe trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-probe-trace-v42
          path: |
            trace.txt
            out/